name: Build Revival Mod visual test APK

on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - ".github/workflows/build-visual-test.yml"
      - "tools/build_visual_test_apk.py"
      - "tools/xgs_kpx_v2.py"
      - "tools/xox2_codec.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install APK and image tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apktool
          python -m pip install --upgrade pip pillow
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Download exact original APK and saved icon
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh release download game --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir input
          gh release download game --repo "$GITHUB_REPOSITORY" --pattern "f3313d17-ccf7-4c82-8007-c68b4233b65d.png" --dir input
          mapfile -t APKS < <(find input -maxdepth 1 -type f -name '*.apk')
          test "\${#APKS[@]}" -eq 1
          echo "APK_FILE=\${APKS[0]}" >> "$GITHUB_ENV"
          echo "ICON_FILE=input/f3313d17-ccf7-4c82-8007-c68b4233b65d.png" >> "$GITHUB_ENV"
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  \${APKS[0]}" | sha256sum -c -
      - name: Build visual-only APK with native settings preview
        run: |
          set -euo pipefail
          python tools/build_visual_test_apk.py --apk "$APK_FILE" --icon "$ICON_FILE" --out output --repo .
      - name: Align, sign and verify test APK
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/abt-visual-test.jks" \
            -storepass "temporary-test-password" \
            -keypass "temporary-test-password" \
            -alias abt-visual-test \
            -dname "CN=ABT Revival Mod Visual Test,O=Community Mod,C=CL" \
            -keyalg RSA -keysize 2048 -validity 10000
          zipalign -f -p 4 output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST-unsigned.apk output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST-aligned.apk
          apksigner sign --ks "$RUNNER_TEMP/abt-visual-test.jks" --ks-key-alias abt-visual-test \
            --ks-pass pass:temporary-test-password --key-pass pass:temporary-test-password \
            --out output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST.apk \
            output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST-aligned.apk
          apksigner verify --verbose output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST.apk
          zipalign -c -v 4 output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST.apk
          sha256sum output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST.apk
      - name: Upload visual test APK and report
        uses: actions/upload-artifact@v4
        with:
          name: abt-revival-visual-test-apk
          path: |
            output/Angry-Birds-Transformers-Revival-Mod-VISUAL-TEST.apk
            output/visual-test-report.json
          if-no-files-found: error
          retention-days: 14
