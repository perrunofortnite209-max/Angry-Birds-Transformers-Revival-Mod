name: Analyze native graphics configuration readers
on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - "tools/analyze_graphics_config_xrefs.py"
      - "tools/inspect_performance_profile_table.py"
      - "tools/trace_render_scale_references.py"
      - "tools/trace_render_scale_globals.py"
      - "tools/trace_explosion_hotspots.py"
      - "tools/trace_particle_manager_detail.py"
      - ".github/workflows/graphics-config-native-analysis.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ELF analysis dependencies
        run: python -m pip install pyelftools capstone lz4
      - name: Download and verify original APK privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private" "$RUNNER_TEMP/native" "$RUNNER_TEMP/out"
          gh release download game --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir "$RUNNER_TEMP/private"
          APK="$(find "$RUNNER_TEMP/private" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  $APK" | sha256sum -c -
          python - "$APK" "$RUNNER_TEMP/native/libABBS-arm64.so" <<'PY'
          import sys,zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as z:
              Path(sys.argv[2]).write_bytes(z.read("lib/arm64-v8a/libABBS.so"))
          PY
      - name: Find native graphics config readers
        run: python tools/analyze_graphics_config_xrefs.py "$RUNNER_TEMP/native/libABBS-arm64.so" "$RUNNER_TEMP/out/graphics-config-xrefs.txt"
      - name: Resolve runtime performance profile names
        run: python tools/inspect_performance_profile_table.py "$RUNNER_TEMP/native/libABBS-arm64.so" "$RUNNER_TEMP/out/performance-profile-table.txt"
      - name: Trace render scale function references
        run: python tools/trace_render_scale_references.py "$APK" "$RUNNER_TEMP/out/render-scale-reference-trace.txt"
      - name: Trace render-scale global references
        run: python tools/trace_render_scale_globals.py "$APK" "$RUNNER_TEMP/out/render-scale-global-references.txt"
      - name: Trace explosion and particle hotspots
        run: python tools/trace_explosion_hotspots.py "$APK" "$RUNNER_TEMP/out/explosion-particle-hotspots.txt"
      - name: Inventory packaged device and graphics configuration archives
        run: |
          python - "$APK" "$RUNNER_TEMP/out/pak-inventory.txt" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk, report = sys.argv[1:]
          with zipfile.ZipFile(apk) as z:
              rows = [f"{x.filename} | {x.file_size} bytes" for x in z.infolist()
                      if not x.is_dir() and x.filename.lower().endswith(".pak")]
          Path(report).write_text("\n".join(rows) + "\n", encoding="utf-8")
          print("\n".join(rows))
          PY
      - name: Extract and inspect deviceconfigs.pak
        run: |
          python - "$APK" "$RUNNER_TEMP/out/deviceconfigs-extracted" "$RUNNER_TEMP/out/deviceconfigs-report.txt" <<'PY'
          import sys, zipfile
          from pathlib import Path
          sys.path.insert(0, "tools")
          from extract_xgs_pak import parse_pak
          apk, out_dir, report = sys.argv[1:]
          with zipfile.ZipFile(apk) as z:
              blob = z.read("assets/data/deviceconfigs.pak")
          lines = parse_pak(blob, "assets/data/deviceconfigs.pak", out_dir)
          Path(report).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines[:120]))
          PY
      - name: Extract VFXLimitConfig.xml from xml.pak
        run: |
          python - "$APK" "$RUNNER_TEMP/out/xml-extracted" "$RUNNER_TEMP/out/vfx-limit-config-report.txt" <<'PY'
          import sys, zipfile
          from pathlib import Path
          sys.path.insert(0, "tools")
          from extract_xgs_pak import parse_pak
          apk, out_dir, report = sys.argv[1:]
          with zipfile.ZipFile(apk) as z:
              blob = z.read("assets/data/xml.pak")
          lines = parse_pak(blob, "assets/data/xml.pak", out_dir)
          matches = [line for line in lines if "VFXLimitConfig.xml" in line]
          Path(report).write_text("\n".join(matches) + "\n", encoding="utf-8")
          print("\n".join(matches) if matches else "VFXLimitConfig.xml not listed by parser")
          for p in Path(out_dir).rglob("*"):
              if p.is_file() and p.name.lower() == "vfxlimitconfig.xml":
                  print("---- extracted config ----")
                  print(p.read_text(encoding="utf-8", errors="replace"))
          PY
      - name: Scan all XML archives for VFXLimitConfig.xml
        run: |
          python - "$APK" "$RUNNER_TEMP/out/xml-all-extracted" "$RUNNER_TEMP/out/vfx-xml-archive-scan.txt" <<'PY'
          import sys, zipfile
          from pathlib import Path
          sys.path.insert(0, "tools")
          from extract_xgs_pak import parse_pak
          apk, out_dir, report = sys.argv[1:]
          rows = []
          with zipfile.ZipFile(apk) as z:
              for name in sorted(n for n in z.namelist() if n.lower().endswith(".pak") and ("xml" in n.lower() or "config" in n.lower())):
                  blob = z.read(name)
                  if len(blob) < 4 or blob[0] != 2 or blob[1:4] != b"KPX":
                      rows.append(f"SKIP {name}: unsupported header {blob[:4].hex()}")
                      continue
                  target = str(Path(out_dir) / Path(name).stem)
                  try:
                      lines = parse_pak(blob, name, target)
                      matches = [x for x in lines if "VFXLimitConfig.xml" in x]
                      rows.append(f"ARCHIVE {name}: entries={len(lines)-1}; matches={len(matches)}")
                      rows.extend(matches)
                  except Exception as exc:
                      rows.append(f"ERROR {name}: {type(exc).__name__}: {exc}")
          for p in Path(out_dir).rglob("*"):
              if p.is_file() and p.name.lower() == "vfxlimitconfig.xml":
                  rows.append(f"EXTRACTED {p}")
                  rows.append(p.read_text(encoding="utf-8", errors="replace"))
          Path(report).write_text("\n".join(rows) + "\n", encoding="utf-8")
          print("\n".join(rows))
          PY
      - name: Trace particle manager internals (read-only)
        run: python tools/trace_particle_manager_detail.py "$APK" "$RUNNER_TEMP/out/particle-manager-detail.txt"
      - name: Upload text report
        uses: actions/upload-artifact@v4
        with:
          name: native-graphics-config-xrefs
          path: |
            ${{ runner.temp }}/out/graphics-config-xrefs.txt
            ${{ runner.temp }}/out/performance-profile-table.txt
            ${{ runner.temp }}/out/render-scale-reference-trace.txt
            ${{ runner.temp }}/out/render-scale-global-references.txt
            ${{ runner.temp }}/out/explosion-particle-hotspots.txt
            ${{ runner.temp }}/out/particle-manager-detail.txt
            ${{ runner.temp }}/out/pak-inventory.txt
            ${{ runner.temp }}/out/deviceconfigs-report.txt
            ${{ runner.temp }}/out/deviceconfigs-extracted/**
            ${{ runner.temp }}/out/vfx-xml-archive-scan.txt
            ${{ runner.temp }}/out/xml-all-extracted/**
          if-no-files-found: error
          retention-days: 7
