name: Scan XGS graphics configuration candidates

on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - ".github/workflows/xgs-graphics-config-scan.yml"
      - "tools/xgs_kpx_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive dependencies
        run: python -m pip install lz4
      - name: Download and verify original APK privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private" "$RUNNER_TEMP/paks" "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/out"
          gh release download game --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir "$RUNNER_TEMP/private"
          APK="$(find "$RUNNER_TEMP/private" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  $APK" | sha256sum -c -
          python - "$APK" "$RUNNER_TEMP/paks" <<'PY'
          import sys,zipfile
          from pathlib import Path
          apk,out=Path(sys.argv[1]),Path(sys.argv[2])
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if name.lower().endswith(".pak"):
                      data=z.read(name)
                      if data[:4]==b"\x02KPX":
                          (out/Path(name).name).write_bytes(data)
          print("KPX archives:",len(list(out.glob("*.pak"))))
          PY
      - name: Build pinned XOX2 decoder and unpack all PAK archives
        run: |
          set -euo pipefail
          git clone https://github.com/omonkeyz/angry-birds-go-rust.git "$RUNNER_TEMP/abgtool"
          git -C "$RUNNER_TEMP/abgtool" checkout 7cd02d36d42b58b652fdc98848de08221d1a0469
          cargo build --release --manifest-path "$RUNNER_TEMP/abgtool/abgtool/Cargo.toml"
          ABG="$RUNNER_TEMP/abgtool/abgtool/target/release/abgtool"
          for p in "$RUNNER_TEMP"/paks/*.pak; do
            test -f "$p" || continue
            dest="$RUNNER_TEMP/unpacked/$(basename "$p" .pak)"
            mkdir -p "$dest"
            "$ABG" unpack "$p" "$dest"
          done
          python - "$ABG" "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/out" "$RUNNER_TEMP/decode-errors.txt" <<'PY'
          import subprocess,sys
          from pathlib import Path
          tool,root,out,errors=map(Path,sys.argv[1:])
          files=sorted(root.rglob("*.xml"))+sorted(root.rglob("*.XML"))
          failed=[]
          for f in files:
              rel=f.relative_to(root)
              safe=str(rel).replace("/","__").replace(" ","_")
              result=subprocess.run([str(tool),"xox",str(f)],capture_output=True,text=True)
              if result.returncode:
                  failed.append(f"{rel}: {result.stderr.strip() or result.stdout.strip()}")
                  continue
              (out/(safe+".decoded")).write_text(result.stdout,errors="replace")
          errors.write_text("\n".join(failed)+"\n")
          print(f"XML candidates: {len(files)}; decoded: {len(files)-len(failed)}; decode errors: {len(failed)}")
          if not files: raise SystemExit("No XML files found after PAK extraction.")
          if len(files)==len(failed): raise SystemExit("No XML files could be decoded; inspect decoder compatibility.")
          PY
      - name: Map extracted Android device profiles to source PAK
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/out/pak-deviceconfig-map.txt" <<'PY'
          import sys
          from pathlib import Path
          root,out=Path(sys.argv[1]),Path(sys.argv[2])
          lines=[]
          for folder in sorted(p for p in root.iterdir() if p.is_dir()):
              matches=sorted(folder.rglob("*.xml"))+sorted(folder.rglob("*.XML"))
              matches=[p for p in matches if "deviceconfig" in p.parent.as_posix().lower() or "deviceconfig" in p.name.lower()]
              if matches:
                  lines += [f"PAK: {folder.name}.pak", f"deviceconfig XML count: {len(matches)}"]
                  lines += [f"  {p.relative_to(folder).as_posix()}" for p in matches]
                  lines.append("")
          out.write_text("\\n".join(lines)+"\\n")
          print(out.read_text())
          if not lines: raise SystemExit("No extracted deviceconfig XML files could be mapped to a PAK.")
          PY
      - name: Verify reversible deviceconfigs PAK and profile codec round-trip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out/deviceconfig-validation" "$RUNNER_TEMP/out/deviceconfig-xox"
          python tools/xgs_kpx_v2.py roundtrip "$RUNNER_TEMP/paks/deviceconfigs.pak" "$RUNNER_TEMP/out/deviceconfig-validation/deviceconfigs-roundtrip.pak"
          cmp "$RUNNER_TEMP/paks/deviceconfigs.pak" "$RUNNER_TEMP/out/deviceconfig-validation/deviceconfigs-roundtrip.pak"
          python - "$RUNNER_TEMP/unpacked/deviceconfigs" "$RUNNER_TEMP/out/deviceconfig-xox" "$RUNNER_TEMP/abgtool/abgtool/target/release/abgtool" <<'PY'
          import subprocess,sys,hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source,out,abg=map(Path,sys.argv[1:])
          report=[]
          for path in sorted(source.glob("*.xml")):
              decoded=subprocess.run([str(abg),"xox",str(path)],capture_output=True,text=True)
              if decoded.returncode:
                  report.append(f"FAIL decode {path.name}: {decoded.stderr.strip()}")
                  continue
              xml=decoded.stdout
              try: ET.fromstring(xml)
              except Exception as exc:
                  report.append(f"FAIL XML {path.name}: {exc}")
                  continue
              original=out/(path.stem+".original.xml")
              encoded=out/(path.stem+".rebuilt.xox2")
              restored=out/(path.stem+".restored.xml")
              original.write_text(xml,encoding="utf-8")
              enc=subprocess.run([sys.executable,"tools/xox2_codec.py",str(original),str(encoded)],capture_output=True,text=True)
              if enc.returncode:
                  report.append(f"FAIL encode {path.name}: {enc.stderr.strip()}")
                  continue
              dec=subprocess.run([str(abg),"xox",str(encoded)],capture_output=True,text=True)
              if dec.returncode:
                  report.append(f"FAIL cross-decode {path.name}: {dec.stderr.strip()}")
                  continue
              restored.write_text(dec.stdout,encoding="utf-8")
              same=ET.canonicalize(xml)==ET.canonicalize(dec.stdout)
              report.append(f"{'PASS' if same else 'FAIL'} {path.name}: {len(xml)} chars sha256={hashlib.sha256(xml.encode()).hexdigest()}")
          (out/"profile-roundtrip-report.txt").write_text("\\n".join(report)+"\\n")
          print("\\n".join(report))
          if not report or any(line.startswith("FAIL") for line in report):
              raise SystemExit("At least one Android/device profile failed independent XOX2 round-trip validation.")
          PY
          echo "deviceconfigs_pak_noop_roundtrip=PASS" > "$RUNNER_TEMP/out/deviceconfig-validation/result.txt"
          echo "profile_xox2_cross_roundtrip=PASS" >> "$RUNNER_TEMP/out/deviceconfig-validation/result.txt"
      - name: Find real graphics and frame-pacing configuration candidates
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/out" "$RUNNER_TEMP/decode-errors.txt" "$RUNNER_TEMP/scan-report.md" <<'PY'
          import re,sys
          from pathlib import Path
          root,errors,report=Path(sys.argv[1]),Path(sys.argv[2]),Path(sys.argv[3])
          rx=re.compile(r'quality|shadow|reflection|texture|resolution|render.?scale|post.?process|particle|effect|graphics|frame.?rate|vsync|present|anisotrop|filter|lod|detail|gpu|performance',re.I)
          files=sorted(root.glob('*.decoded'))
          failed=errors.read_text(errors='replace').splitlines()
          out=["# XGS graphics/configuration string scan","",f"Decoded XML files: {len(files)}",f"XML decode failures: {len(failed)}",""]
          matched=0
          for path in files:
              hits=[]
              for n,line in enumerate(path.read_text(errors='replace').splitlines(),1):
                  if rx.search(line):
                      hits.append((n,line.strip()))
              if not hits: continue
              matched+=1
              out += [f"## {path.name} — {len(hits)} matches",""]
              out += [f"- L{n}: `{line[:400]}`" for n,line in hits[:100]]
              out.append("")
          out += ["## XML files the decoder could not parse",""]
          out += [f"- `{line[:500]}`" for line in failed[:300]]
          out += ["","## Interpretation","",
                  "String matches are leads only. A setting is not considered runtime-active until native references and read/write behavior are confirmed.",
                  "Decoder failures are listed rather than silently terminating the scan.",
                  "No game assets or APK files are included in this report."]
          report.write_text("\n".join(out)+"\n")
          device_dir=report.parent/"deviceconfigs-full"
          device_dir.mkdir(exist_ok=True)
          device_files=sorted(root.glob("deviceconfigs__*.decoded"))
          for path in device_files:
              (device_dir/(path.name+".xml")).write_text(path.read_text(errors="replace"))
          (report.parent/"deviceconfigs-index.txt").write_text(
              "\n".join(f"{p.name}\t{len(p.read_text(errors='replace'))} chars" for p in device_files)+"\n")
          print(f"Decoded XML files: {len(files)}; files with candidate strings: {matched}; decode failures: {len(failed)}; device profiles: {len(device_files)}")
          if not files: raise SystemExit("No XML files were decoded; inspect archive extraction.")
          PY
      - name: Upload text-only graphics scan report
        uses: actions/upload-artifact@v4
        with:
          name: xgs-graphics-config-candidates
          path: |
            ${{ runner.temp }}/scan-report.md
            ${{ runner.temp }}/decode-errors.txt
            ${{ runner.temp }}/deviceconfigs-full/
            ${{ runner.temp }}/deviceconfigs-index.txt
            ${{ runner.temp }}/out/pak-deviceconfig-map.txt
            ${{ runner.temp }}/out/deviceconfig-validation/
            ${{ runner.temp }}/out/deviceconfig-xox/profile-roundtrip-report.txt
          if-no-files-found: error
          retention-days: 7
