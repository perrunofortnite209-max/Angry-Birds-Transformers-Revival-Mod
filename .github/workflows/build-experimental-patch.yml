name: Build experimental 144 FPS APK

on:
  push:
    branches: [main]
    paths:
      - "tools/patch_fps_experimental.py"
      - ".github/workflows/build-experimental-patch.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the analyzed original APK"
        required: true
        default: "game"

permissions:
  contents: read

jobs:
  patch-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch tools
        uses: actions/checkout@v4

      - name: Download exact original APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'game' }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir input
          mapfile -t APKS < <(find input -maxdepth 1 -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          echo "APK_FILE=${APKS[0]}" >> "$GITHUB_ENV"
          sha256sum "${APKS[0]}"

      - name: Install patch dependencies and Android build tools
        run: |
          python3 -m pip install --user pyelftools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK signing tools
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Apply guarded native patch (60 to 144 in gameplay)
        run: |
          set -euo pipefail
          python3 tools/patch_fps_experimental.py "$APK_FILE" output/abt-144fps-unsigned.apk --report output/patch-report.json

      - name: Align and sign experimental APK
        run: |
          set -euo pipefail
          zipalign -f -p 4 output/abt-144fps-unsigned.apk output/abt-144fps-aligned.apk
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/abt-test-key.jks"             -storepass "temporary-test-password"             -keypass "temporary-test-password"             -alias abt-test             -dname "CN=ABT Revival Mod Test,O=Community Mod,C=CL"             -keyalg RSA -keysize 2048 -validity 10000
          apksigner sign             --ks "$RUNNER_TEMP/abt-test-key.jks"             --ks-key-alias abt-test             --ks-pass pass:temporary-test-password             --key-pass pass:temporary-test-password             --out output/Angry-Birds-Transformers-Revival-Mod-144FPS-EXPERIMENTAL.apk             output/abt-144fps-aligned.apk
          apksigner verify --verbose output/Angry-Birds-Transformers-Revival-Mod-144FPS-EXPERIMENTAL.apk
          zipalign -c -v 4 output/Angry-Birds-Transformers-Revival-Mod-144FPS-EXPERIMENTAL.apk
          sha256sum output/Angry-Birds-Transformers-Revival-Mod-144FPS-EXPERIMENTAL.apk

      - name: Upload experimental APK and patch report
        uses: actions/upload-artifact@v4
        with:
          name: abt-144fps-experimental
          path: |
            output/Angry-Birds-Transformers-Revival-Mod-144FPS-EXPERIMENTAL.apk
            output/patch-report.json
          if-no-files-found: error
          retention-days: 7
