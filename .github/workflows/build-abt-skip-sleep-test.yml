name: Build ABT no-secondary-sleep A-B APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag with the original APK
        required: true
        default: game

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/skip-secondary-fps-sleep
      - name: Download original APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh
          mkdir -p input output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir input
          mapfile -t APKS < <(find input -maxdepth 1 -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          echo "APK_FILE=${APKS[0]}" >> "$GITHUB_ENV"
          sha256sum "${APKS[0]}"
      - name: Apply one-instruction patch and verify all PAK files
        run: |
          set -euo pipefail
          python3 tools/patch_skip_secondary_fps_sleep.py "$APK_FILE" output/abt-skip-secondary-sleep-unsigned.apk --report output/patch-report.json
      - name: Set up Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Align and sign
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 output/abt-skip-secondary-sleep-unsigned.apk output/abt-aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/abt-test-key.jks" -storepass temporary-test-password -keypass temporary-test-password -alias abt-test -dname "CN=ABT A-B Test,O=Community Mod,C=CL" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/abt-test-key.jks" --ks-key-alias abt-test --ks-pass pass:temporary-test-password --key-pass pass:temporary-test-password --out output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk output/abt-aligned.apk
          "$BT/apksigner" verify --verbose output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk
          "$BT/zipalign" -c -v 4 output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk
          sha256sum output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: abt-skip-secondary-sleep-test
          path: |
            output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk
            output/patch-report.json
          if-no-files-found: error
          retention-days: 14
