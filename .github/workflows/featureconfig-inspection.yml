name: Inspect native feature configuration definitions

on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - ".github/workflows/featureconfig-inspection.yml"
      - "tools/xgs_kpx_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive dependencies
        run: python -m pip install lz4
      - name: Download original APK privately and extract PAKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private" "$RUNNER_TEMP/paks" "$RUNNER_TEMP/out"
          gh release download game --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir "$RUNNER_TEMP/private"
          APK="$(find "$RUNNER_TEMP/private" -maxdepth 1 -name '*.apk' -print -quit)"
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  $APK" | sha256sum -c -
          python - "$APK" "$RUNNER_TEMP/paks" <<'PY'
          import sys,zipfile
          from pathlib import Path
          apk,out=Path(sys.argv[1]),Path(sys.argv[2])
          with zipfile.ZipFile(apk) as z:
              for n in z.namelist():
                  if n.lower().endswith(".pak"):
                      b=z.read(n)
                      if b[:4]==b"\x02KPX": (out/Path(n).name).write_bytes(b)
          PY
      - name: Extract and decode Global FeatureConfig definitions
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/paks" "$RUNNER_TEMP/out" <<'PY'
          import importlib.util,sys
          from pathlib import Path
          pakdir,out=Path(sys.argv[1]),Path(sys.argv[2])
          spec=importlib.util.spec_from_file_location("xgs_kpx","tools/xgs_kpx_v2.py")
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          found=[]
          for pak in sorted(pakdir.glob("*.pak")):
              blob=pak.read_bytes()
              meta=mod.parse(blob)
              for entry in meta["entries"]:
                  if "featureconfig" in entry.name.lower():
                      data=mod.unpack_entry(blob,meta,entry)
                      safe=entry.name.replace("/","__").replace("\\","__")
                      (out/(safe+".xox2")).write_bytes(data)
                      found.append(f"{pak.name}\t{entry.name}\t{len(data)}")
                      if entry.name.lower().endswith("global/featureconfig.xml") or entry.name.lower()=="global/featureconfig.xml":
                          (out/"FeatureConfig.original.xox2").write_bytes(data)
          (out/"source.txt").write_text("\n".join(found)+"\n")
          if not found:
              raise SystemExit("No FeatureConfig-named entries found in any KPX archive")
          print("FeatureConfig entries found:",len(found))
          print("\n".join(found))
          PY
          git clone https://github.com/omonkeyz/angry-birds-go-rust.git "$RUNNER_TEMP/abgtool"
          git -C "$RUNNER_TEMP/abgtool" checkout 7cd02d36d42b58b652fdc98848de08221d1a0469
          cargo build --release --manifest-path "$RUNNER_TEMP/abgtool/abgtool/Cargo.toml"
          ABG="$RUNNER_TEMP/abgtool/abgtool/target/release/abgtool"
          SOURCE="$(find "$RUNNER_TEMP/out" -maxdepth 1 -name 'FeatureConfig.original.xox2' -print -quit)"
          if [ -z "$SOURCE" ]; then
            SOURCE="$(find "$RUNNER_TEMP/out" -maxdepth 1 -name '*featureconfig.xml.xox2' ! -name '*uifeatureconfigscreen*' -print -quit)"
          fi
          test -n "$SOURCE"
          "$ABG" xox "$SOURCE" > "$RUNNER_TEMP/out/FeatureConfig.decoded.xml"
          python - "$RUNNER_TEMP/out/FeatureConfig.decoded.xml" "$RUNNER_TEMP/out/feature-list.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          keys=("feature","name","id","default","value","description","fps","frame")
          lines=[tag for tag in re.findall(r"<[^>]+>",s) if any(k in tag.lower() for k in keys)]
          Path(sys.argv[2]).write_text("\n".join(lines)+"\n")
          print("Feature definitions:",len(lines))
          PY
      - name: Upload text-only feature configuration
        uses: actions/upload-artifact@v4
        with:
          name: featureconfig-inspection
          path: ${{ runner.temp }}/out/
          retention-days: 7
