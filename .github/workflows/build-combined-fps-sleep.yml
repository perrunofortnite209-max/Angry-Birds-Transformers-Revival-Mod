name: Build combined ABT FPS experiment

on:
  push:
    branches: [experiment/combined-fps-sleep]
    paths:
      - "tools/patch_combined_fps_sleep.py"
      - ".github/workflows/build-combined-fps-sleep.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the original APK
        required: true
        default: game

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/combined-fps-sleep
      - name: Download exact original APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'game' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh
          mkdir -p input output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir input
          mapfile -t APKS < <(find input -maxdepth 1 -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          echo "APK_FILE=${APKS[0]}" >> "$GITHUB_ENV"
          sha256sum "${APKS[0]}"
      - name: Apply combined native patches and verify every PAK
        run: |
          set -euo pipefail
          python3 tools/patch_combined_fps_sleep.py "$APK_FILE" output/abt-combined-unsigned.apk --report output/combined-patch-report.json
      - name: Set up Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Align and sign experimental APK
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 output/abt-combined-unsigned.apk output/abt-combined-aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/abt-combined-test-key.jks" -storepass temporary-test-password -keypass temporary-test-password -alias abt-test -dname "CN=ABT Combined Test,O=Community Mod,C=CL" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/abt-combined-test-key.jks" --ks-key-alias abt-test --ks-pass pass:temporary-test-password --key-pass pass:temporary-test-password --out output/Angry-Birds-Transformers-Revival-Mod-COMBINED-EXPERIMENTAL.apk output/abt-combined-aligned.apk
          "$BT/apksigner" verify --verbose output/Angry-Birds-Transformers-Revival-Mod-COMBINED-EXPERIMENTAL.apk
          "$BT/zipalign" -c -v 4 output/Angry-Birds-Transformers-Revival-Mod-COMBINED-EXPERIMENTAL.apk
          sha256sum output/Angry-Birds-Transformers-Revival-Mod-COMBINED-EXPERIMENTAL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: abt-combined-fps-sleep-experimental
          path: |
            output/Angry-Birds-Transformers-Revival-Mod-COMBINED-EXPERIMENTAL.apk
            output/combined-patch-report.json
          if-no-files-found: error
          retention-days: 14
