name: Inspect APK (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-private-apk.yml"
      - "tools/**"
      - "ghidra_scripts/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the original APK asset"
        required: true
        default: "game"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4

      - name: Install read-only inspection utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip binutils llvm curl jq

      - name: Install Ghidra headless
        run: bash tools/install-ghidra.sh

      - name: Download APK from this repository's Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'game' }}
        run: |
          set -euo pipefail
          mkdir -p private-input
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.apk" \
            --dir private-input
          mapfile -t APKS < <(find private-input -maxdepth 1 -type f -name '*.apk')
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Se esperaba exactamente un APK en la Release; encontrados: ${#APKS[@]}" >&2
            exit 1
          fi
          echo "APK_FILE=${APKS[0]}" >> "$GITHUB_ENV"

      - name: Verify and inspect native FPS-related strings
        run: |
          set -euo pipefail
          bash tools/inspect-apk.sh "$APK_FILE"
          bash tools/inspect-native-fps.sh "$APK_FILE"
          bash tools/inspect-native-disassembly.sh "$APK_FILE"

      - name: Analyze ARM libraries and FPS cross-references with Ghidra
        run: |
          set -euo pipefail
          mkdir -p native-work reports
          for ABI in arm64-v8a armeabi-v7a; do
            LIB="lib/$ABI/libABBS.so"
            OUT="native-work/libABBS-$ABI.so"
            unzip -p "$APK_FILE" "$LIB" > "$OUT"
            .tools/ghidra/support/analyzeHeadless \
              "$RUNNER_TEMP/ghidra-project-$ABI" "ABT-$ABI" \
              -import "$OUT" -overwrite \
              -scriptPath ghidra_scripts \
              -postScript FindFpsStringXrefs.java "reports/fps-xrefs-$ABI.txt" \
              -analysisTimeoutPerFile 900
          done

      - name: Publish text reports only
        uses: actions/upload-artifact@v4
        with:
          name: abt-apk-analysis
          path: reports/*.txt
          if-no-files-found: error
          retention-days: 7
