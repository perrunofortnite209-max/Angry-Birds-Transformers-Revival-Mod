name: Analyze Android integration points

on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - ".github/workflows/analyze-android-integration.yml"
      - "tools/analyze_android_integration.sh"
      - "tools/extract_xgs_pak.py"
      - "tools/summarize_xgs_ui.py"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the user's original APK"
        required: true
        default: "game"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Checkout verified XOX1/XOX2 decoder
        uses: actions/checkout@v4
        with:
          repository: omonkeyz/angry-birds-go-rust
          ref: 7cd02d36d42b58b652fdc98848de08221d1a0469
          path: .tools/angry-birds-go-rust

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build XOX decoder
        run: cargo build --release --manifest-path .tools/angry-birds-go-rust/abgtool/Cargo.toml

      - name: Set up Java for APK decoding
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android inspection tools
        run: |
          set -euo pipefail
          java -version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apktool unzip aapt

      - name: Install XGS archive decoder
        run: |
          python3 -m pip install --user --break-system-packages lz4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download exact original APK privately
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'game' }}
        run: |
          set -euo pipefail
          mkdir -p private-input reports
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir private-input
          mapfile -t APKS < <(find private-input -maxdepth 1 -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          echo "APK_FILE=${APKS[0]}" >> "$GITHUB_ENV"
          sha256sum "${APKS[0]}" | tee reports/apk-hash.txt

      - name: Inspect manifest, entry points and dex signatures
        run: |
          set -euo pipefail
          export ABGTOOL="$GITHUB_WORKSPACE/.tools/angry-birds-go-rust/abgtool/target/release/abgtool"
          bash tools/analyze_android_integration.sh "$APK_FILE" reports
          cat reports/android-integration-report.txt

      - name: Map native frontend screens and button actions
        run: |
          set -euo pipefail
          python3 tools/summarize_xgs_ui.py "$RUNNER_TEMP/xgs-ui-extracted" reports/xgs-ui-screen-map.txt

      - name: Upload text-only diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: abt-android-integration-diagnostics
          path: reports/*
          if-no-files-found: error
          retention-days: 7
