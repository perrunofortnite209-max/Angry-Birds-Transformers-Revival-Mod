name: Build Revival Mod safe combined APK
on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - "tools/build_combined_safe_apk.py"
      - "tools/build_visual_test_apk.py"
      - ".github/workflows/build-combined-safe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install APK tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl
          sdkmanager --install 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "$RUNNER_TEMP/apktool.jar" "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
      - name: Download exact original APK
        run: |
          set -euo pipefail
          mkdir -p input output
          curl -fL --retry 3 "https://github.com/perrunofortnite209-max/Angry-Birds-Transformers-Revival-Mod/releases/download/game/com.rovio.angrybirdstransformers-24200.apk" -o input/original.apk
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  input/original.apk" | sha256sum -c -
      - name: Build combined DEX and native patch
        run: |
          set -euo pipefail
          python tools/build_combined_safe_apk.py --apk input/original.apk --out output/ABT-REVIVAL-COMBINED-unsigned.apk --repo .
      - name: Align, sign and verify
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/abt-combined.jks" -storepass "temporary-test-password" -keypass "temporary-test-password" -alias abt-combined -dname "CN=ABT Revival Mod,O=Community Mod,C=CL" -keyalg RSA -keysize 2048 -validity 10000
          zipalign -f -p 4 output/ABT-REVIVAL-COMBINED-unsigned.apk output/ABT-REVIVAL-COMBINED-aligned.apk
          apksigner sign --ks "$RUNNER_TEMP/abt-combined.jks" --ks-key-alias abt-combined --ks-pass pass:temporary-test-password --key-pass pass:temporary-test-password --out output/Angry-Birds-Transformers-Revival-Mod.apk output/ABT-REVIVAL-COMBINED-aligned.apk
          apksigner verify --verbose output/Angry-Birds-Transformers-Revival-Mod.apk
          zipalign -c -v 4 output/Angry-Birds-Transformers-Revival-Mod.apk
          sha256sum output/Angry-Birds-Transformers-Revival-Mod.apk
      - name: Upload APK and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: abt-revival-safe-combined
          path: |
            output/Angry-Birds-Transformers-Revival-Mod.apk
            output/ABT-REVIVAL-COMBINED.report.json
          if-no-files-found: error
          retention-days: 14
