name: Build Revival Mod safe combined APK
on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - "tools/build_combined_safe_apk.py"
      - "tools/build_visual_test_apk.py"
      - ".github/workflows/build-combined-safe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Python image dependency
        run: python -m pip install --upgrade pillow
      - name: Install APK tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl
          sdkmanager --install 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "$RUNNER_TEMP/apktool.jar" "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
      - name: Compile runtime JNI bridge for both ABIs
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          mkdir -p output/bridge
          "$CLANG" --target=aarch64-linux-android21 -shared -fPIC -O2 -fvisibility=hidden -Wl,-soname,libabtmod.so -o output/bridge/libabtmod-arm64.so tools/abt_native_bridge.cpp -ldl
          "$CLANG" --target=armv7a-linux-androideabi21 -shared -fPIC -O2 -fvisibility=hidden -Wl,-soname,libabtmod.so -o output/bridge/libabtmod-armv7.so tools/abt_native_bridge.cpp -ldl
          file output/bridge/*.so
      - name: Download exact original APK
        run: |
          set -euo pipefail
          mkdir -p input output
          curl -fL --retry 3 "https://github.com/perrunofortnite209-max/Angry-Birds-Transformers-Revival-Mod/releases/download/game/com.rovio.angrybirdstransformers-24200.apk" -o input/original.apk
          curl -fL --retry 3 "https://github.com/perrunofortnite209-max/Angry-Birds-Transformers-Revival-Mod/releases/download/game/f3313d17-ccf7-4c82-8007-c68b4233b65d.png" -o input/user-icon.png
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  input/original.apk" | sha256sum -c -
      - name: Build combined DEX and native patch
        run: |
          set -euo pipefail
          python tools/build_combined_safe_apk.py --apk input/original.apk --out output/ABT-REVIVAL-COMBINED-unsigned.apk --repo . --icon input/user-icon.png --native-arm64 output/bridge/libabtmod-arm64.so --native-armv7 output/bridge/libabtmod-armv7.so
      - name: Align, sign and verify
        env:
          ABT_SIGNING_KEY_BASE64: ${{ secrets.ABT_SIGNING_KEY_BASE64 }}
          ABT_SIGNING_STORE_PASSWORD: ${{ secrets.ABT_SIGNING_STORE_PASSWORD }}
          ABT_SIGNING_KEY_PASSWORD: ${{ secrets.ABT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ABT_SIGNING_KEY_BASE64" || { echo "Falta el secreto ABT_SIGNING_KEY_BASE64"; exit 1; }
          test -n "$ABT_SIGNING_STORE_PASSWORD" || { echo "Falta el secreto ABT_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$ABT_SIGNING_KEY_PASSWORD" || { echo "Falta el secreto ABT_SIGNING_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ABT_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/abt-revival-release.jks"
          zipalign -f -p 4 output/ABT-REVIVAL-COMBINED-unsigned.apk output/ABT-REVIVAL-COMBINED-aligned.apk
          apksigner sign --ks "$RUNNER_TEMP/abt-revival-release.jks" --ks-key-alias abt-revival --ks-pass env:ABT_SIGNING_STORE_PASSWORD --key-pass env:ABT_SIGNING_KEY_PASSWORD --out output/Angry-Birds-Transformers-Revival-Mod.apk output/ABT-REVIVAL-COMBINED-aligned.apk
          apksigner verify --verbose output/Angry-Birds-Transformers-Revival-Mod.apk
          zipalign -c -v 4 output/Angry-Birds-Transformers-Revival-Mod.apk
          sha256sum output/Angry-Birds-Transformers-Revival-Mod.apk
      - name: Upload APK and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: abt-revival-safe-combined
          path: |
            output/Angry-Birds-Transformers-Revival-Mod.apk
            output/ABT-REVIVAL-COMBINED.report.json
          if-no-files-found: error
          retention-days: 14
