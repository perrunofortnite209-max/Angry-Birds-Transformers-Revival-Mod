name: XOX2 codec round-trip verification

on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - ".github/workflows/xox2-roundtrip-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile codec
        run: python -m py_compile tools/xox2_codec.py
      - name: Run round-trip fixtures
        run: python tools/xox2_codec.py --self-test
