name: Inspect ABT runtime hooks and launcher icon
on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - ".github/workflows/inspect-runtime-and-icon.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install APK tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "$RUNNER_TEMP/apktool.jar" "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
      - name: Download exact APK and user icon
        run: |
          set -euo pipefail
          mkdir -p input output
          curl -fL --retry 3 "https://github.com/perrunofortnite209-max/Angry-Birds-Transformers-Revival-Mod/releases/download/game/com.rovio.angrybirdstransformers-24200.apk" -o input/original.apk
          curl -fL --retry 3 "https://github.com/perrunofortnite209-max/Angry-Birds-Transformers-Revival-Mod/releases/download/game/f3313d17-ccf7-4c82-8007-c68b4233b65d.png" -o input/user-icon.png
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  input/original.apk" | sha256sum -c -
      - name: Decode and inspect Activity and icon resources
        run: |
          set -euo pipefail
          apktool d -f input/original.apk -o decoded
          mkdir -p output/native
          python - <<'PY'
          import zipfile, pathlib
          z=zipfile.ZipFile("input/original.apk")
          for n in z.namelist():
              if n.startswith("lib/") and n.endswith(".so") and ("ABBS" in n or "main" in n.lower()):
                  p=pathlib.Path("output/native")/n.replace("/","_")
                  p.write_bytes(z.read(n))
          print("Native libraries extracted:", *[p.name for p in pathlib.Path("output/native").glob("*")], sep="\\n")
          PY
          for f in output/native/*.so; do
            [ -f "$f" ] || continue
            strings -a "$f" | grep -Ei 'download|resource|content|pak|asset|bundle|progress|complete|finished|load.*data|data.*load|network' > "${f}.strings" || true
            readelf -Ws "$f" > "${f}.symbols" || true
          done
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          root=Path("decoded")
          manifest=ET.parse(root/"AndroidManifest.xml").getroot()
          ns="{http://schemas.android.com/apk/res/android}"
          app=manifest.find("application")
          names=[]
          launcher_names=[]
          for tag in ("activity","activity-alias"):
              for node in app.findall(tag):
                  name=node.get(ns+"name")
                  if not name: continue
                  names.append(name)
                  for filt in node.findall("intent-filter"):
                      actions={x.get(ns+"name") for x in filt.findall("action")}
                      cats={x.get(ns+"name") for x in filt.findall("category")}
                      if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in cats:
                          launcher_names.append(name)
                          break
          package=manifest.get("package","")
          def normalize(name):
              if name.startswith("."): name=package+name
              elif "." not in name: name=package+"."+name
              return name.replace(".","/")
          launcher_classes=[normalize(x) for x in launcher_names]
          if len(launcher_classes)!=1:
              raise SystemExit(f"Expected exactly one MAIN/LAUNCHER activity, found {launcher_names}")
          files=list(root.glob("smali*/**/*.smali"))
          candidates=[]
          for p in files:
              source=p.read_text(errors="ignore")
              class_lines=[line for line in source.splitlines() if line.startswith(".class ") and ("L"+launcher_classes[0]+";") in line]
              if len(class_lines)==1:
                  candidates.append((p,source,launcher_classes[0],True))
          if len(candidates)!=1:
              raise SystemExit(f"Could not resolve launcher Activity smali: {launcher_names}; matches={len(candidates)}")
          p,s,cls,is_manifest=candidates[0]
          Path("output/main_activity.smali").write_text(s)
          (Path("output/manifest.xml")).write_text((root/"AndroidManifest.xml").read_text(errors="ignore"))
          icon_files=[]
          for q in (root/"res").rglob("*"):
              if q.is_file() and ("ic_launcher" in q.name.lower() or "icon" in q.name.lower()):
                  icon_files.append(str(q.relative_to(root)))
          report={"package":package,"manifest_activities":names,"selected_activity_class":cls,
                  "selected_class_matches_manifest":is_manifest,"activity_path":str(p.relative_to(root)),
                  "activity_methods":re.findall(r"(?m)^\.method[^\n]*",s),
                  "icon_resource_files":icon_files,
                  "manifest_icon_lines":[x.strip() for x in (root/"AndroidManifest.xml").read_text(errors="ignore").splitlines() if "icon" in x.lower()],
                  "smali_files":len(files)}
          Path("output/inspection.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: abt-runtime-icon-inspection
          path: |
            output/main_activity.smali
            output/manifest.xml
            output/inspection.json
            input/user-icon.png
            output/native/*
          if-no-files-found: error
          retention-days: 7
