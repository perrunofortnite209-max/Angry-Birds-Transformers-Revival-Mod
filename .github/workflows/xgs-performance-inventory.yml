name: XGS performance-path inventory (read-only)

on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - "tools/analyze_xgs_performance.py"
      - "tools/analyze_xgs_render_passes.py"
      - ".github/workflows/xgs-performance-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-revival-mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ELF analysis tools
        run: python -m pip install pyelftools capstone
      - name: Download and verify original APK privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private" "$RUNNER_TEMP/native" "$RUNNER_TEMP/out"
          gh release download game --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir "$RUNNER_TEMP/private"
          mapfile -t APKS < <(find "$RUNNER_TEMP/private" -maxdepth 1 -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          echo "ace138aac9456b81432a59b0f1ee9b475d20b0d5cffd4664fc5e4b74d0772013  $APK" | sha256sum -c -
          python - "$APK" "$RUNNER_TEMP/native/libABBS-arm64.so" <<'PY'
          import sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as z:
              Path(sys.argv[2]).write_bytes(z.read("lib/arm64-v8a/libABBS.so"))
          PY
      - name: Inventory render, update, memory and frame-pacing paths
        run: python tools/analyze_xgs_performance.py "$RUNNER_TEMP/native/libABBS-arm64.so" "$RUNNER_TEMP/out/xgs-performance-paths.txt"
      - name: Inspect render pass call graph and instructions
        run: python tools/analyze_xgs_render_passes.py "$RUNNER_TEMP/private/$(basename "$(find "$RUNNER_TEMP/private" -maxdepth 1 -type f -name '*.apk' -print -quit)")" "$RUNNER_TEMP/out/xgs-render-pass-inspection.md"
      - name: Upload text-only report
        uses: actions/upload-artifact@v4
        with:
          name: xgs-performance-path-inventory
          path: |
            ${{ runner.temp }}/out/xgs-performance-paths.txt
            ${{ runner.temp }}/out/xgs-render-pass-inspection.md
          if-no-files-found: error
          retention-days: 7
