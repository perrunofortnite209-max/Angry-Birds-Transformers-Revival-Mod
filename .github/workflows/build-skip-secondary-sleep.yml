name: Build secondary FPS sleep A/B APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag with the original analyzed APK"
        required: true
        default: "game"

permissions:
  contents: read

jobs:
  patch-and-sign:
    if: github.ref == 'refs/heads/experiment/skip-secondary-fps-sleep'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected experiment branch
        uses: actions/checkout@v4

      - name: Download original APK from release
        env:
          GH_TOKEN: \${{ github.token }}
          RELEASE_TAG: \${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir input
          mapfile -t APKS < <(find input -maxdepth 1 -type f -name '*.apk')
          test "\${#APKS[@]}" -eq 1
          echo "APK_FILE=\${APKS[0]}" >> "$GITHUB_ENV"
          sha256sum "\${APKS[0]}"

      - name: Patch only the secondary limiter call
        run: |
          set -euo pipefail
          python3 tools/patch_skip_secondary_fps_sleep.py "$APK_FILE" output/abt-skip-secondary-sleep-unsigned.apk --report output/patch-report.json

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Align and sign test APK
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 output/abt-skip-secondary-sleep-unsigned.apk output/abt-skip-secondary-sleep-aligned.apk
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/abt-ab-test-key.jks" \
            -storepass "temporary-test-password" \
            -keypass "temporary-test-password" \
            -alias abt-ab-test \
            -dname "CN=ABT Secondary Sleep A-B Test,O=Community Mod,C=CL" \
            -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/abt-ab-test-key.jks" \
            --ks-key-alias abt-ab-test \
            --ks-pass pass:temporary-test-password \
            --key-pass pass:temporary-test-password \
            --out output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk \
            output/abt-skip-secondary-sleep-aligned.apk
          "$BT/apksigner" verify --verbose output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk
          "$BT/zipalign" -c -v 4 output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk
          sha256sum output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk

      - name: Upload experimental APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: abt-skip-secondary-fps-sleep-test
          path: |
            output/Angry-Birds-Transformers-Revival-Mod-SKIP-SECONDARY-SLEEP-TEST.apk
            output/patch-report.json
          if-no-files-found: error
          retention-days: 14
