name: Analyze Perfetto Trace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/analyze-perfetto-trace.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest explosion trace
        run: |
          curl -fL --retry 3 "https://github.com/perrunofortnite209-max/Angry-Birds-Transformers-Revival-Mod/releases/download/game/abt-explosion-trace.pftrace" -o abt.pftrace
          test -s abt.pftrace
          sha256sum abt.pftrace
          stat -c '%s bytes' abt.pftrace

      - name: Install trace processor client
        run: |
          python -m pip install --upgrade pip
          python -m pip install perfetto pandas

      - name: Analyze trace
        run: |
          cat > analyze.py <<'PY'
          from perfetto.trace_processor import TraceProcessor
          from pathlib import Path
          out = []
          def section(title, df):
              out.append("\n## " + title + "\n")
              out.append("(sin datos)\n" if df is None or len(df.index) == 0 else df.to_string(index=False) + "\n")
          tp = TraceProcessor(trace="abt.pftrace")
          queries = [
            ("Frame summary", """SELECT COUNT(*) frames,ROUND(AVG(dur)/1e6,2) avg_ms,ROUND(MAX(dur)/1e6,2) max_ms,SUM(dur>16666667) over_16_7ms,SUM(dur>33333333) over_33_3ms FROM slice WHERE name='onDrawFrame' AND dur>0"""),
            ("Trace track and process schema", """SELECT m.name table_name,p.name column_name,p.type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type='table' AND m.name IN ('track','thread_track','process_track','thread','process','slice','args') ORDER BY m.name,p.cid"""),
            ("GPU completion thread process identity", """SELECT th.utid,th.tid,th.name thread_name,th.upid,p.name process_name,p.pid, p.cmdline FROM thread th LEFT JOIN process p ON p.upid=th.upid WHERE th.tid=5034"""),
            ("GPU completion thread metadata", """SELECT sql FROM sqlite_master WHERE name IN ('thread','process','thread_track','process_track') ORDER BY name"""),
            ("GPU wait event track mapping", """SELECT s.track_id,tt.name track_name,tt.type track_type,th.utid,th.tid,th.name thread_name,p.name process_name,p.pid,COUNT(*) events,ROUND(SUM(s.dur)/1e9,3) total_s,ROUND(MAX(s.dur)/1e6,3) max_ms FROM slice s LEFT JOIN thread_track tt ON tt.id=s.track_id LEFT JOIN thread th ON th.utid=tt.utid LEFT JOIN process p ON p.upid=th.upid WHERE LOWER(s.name) LIKE '%waiting for gpu completion%' GROUP BY s.track_id,th.utid ORDER BY SUM(s.dur) DESC LIMIT 30"""),
            ("GPU wait totals grouped by actual owner", """SELECT t.type,t.name track_name,p.name process_name,th.name thread_name,COUNT(*) events,ROUND(SUM(s.dur)/1e9,3) total_s,ROUND(MAX(s.dur)/1e6,3) max_ms FROM slice s LEFT JOIN track t ON t.id=s.track_id LEFT JOIN thread_track tt ON tt.id=t.id LEFT JOIN thread th ON th.utid=tt.utid LEFT JOIN process_track pt ON pt.id=t.id LEFT JOIN process p ON p.upid=pt.upid WHERE LOWER(s.name) LIKE '%waiting for gpu completion%' GROUP BY t.id ORDER BY SUM(s.dur) DESC LIMIT 100"""),
            ("GPU wait overlap with slow frames", """WITH slow AS (SELECT id,ts,dur,track_id FROM slice WHERE name='onDrawFrame' AND dur>16666667), waits AS (SELECT id,ts,dur,track_id,name FROM slice WHERE LOWER(name) LIKE '%waiting for gpu completion%') SELECT ROUND(f.dur/1e6,2) frame_ms,ROUND(w.dur/1e6,3) wait_ms,ROUND(MAX(0,MIN(f.ts+f.dur,w.ts+w.dur)-MAX(f.ts,w.ts))/1e6,3) overlap_ms,w.name,th.name thread FROM slow f JOIN waits w ON w.ts<f.ts+f.dur AND w.ts+w.dur>f.ts LEFT JOIN thread_track tt ON tt.id=w.track_id LEFT JOIN thread th ON th.utid=tt.utid ORDER BY f.dur DESC LIMIT 150"""),
            ("Slowest frames and GL thread states", """WITH slow AS (SELECT id,ts,dur,track_id FROM slice WHERE name='onDrawFrame' AND dur>16666667) SELECT ROUND(f.dur/1e6,2) frame_ms,st.state,ROUND(SUM(MAX(0,MIN(st.ts+st.dur,f.ts+f.dur)-MAX(st.ts,f.ts)))/1e6,3) overlap_ms,COUNT(*) intervals FROM slow f JOIN thread_track tt ON tt.id=f.track_id JOIN thread_state st ON st.utid=tt.utid AND st.ts<f.ts+f.dur AND st.ts+st.dur>f.ts GROUP BY f.id,st.state ORDER BY f.dur DESC,overlap_ms DESC LIMIT 120"""),
            ("Fence and sync slices", """SELECT name,COUNT(*) events,ROUND(SUM(dur)/1e9,3) total_s,ROUND(MAX(dur)/1e6,3) max_ms FROM slice WHERE dur>0 AND (LOWER(name) LIKE '%fence%' OR LOWER(name) LIKE '%sync%' OR LOWER(name) LIKE '%gpu completion%' OR LOWER(name) LIKE '%egl%' OR LOWER(name) LIKE '%swap%') GROUP BY name ORDER BY SUM(dur) DESC LIMIT 120"""),
            ("GPU counters", """SELECT t.name,COUNT(*) samples,ROUND(MIN(c.value),3) min_value,ROUND(AVG(c.value),3) avg_value,ROUND(MAX(c.value),3) max_value FROM counter c JOIN counter_track t ON t.id=c.track_id WHERE LOWER(t.name) LIKE '%gpu%' GROUP BY t.name ORDER BY t.name LIMIT 100"""),
            ("Thread inventory", """SELECT th.name,th.tid,COUNT(*) slices,ROUND(SUM(s.dur)/1e9,3) slice_s FROM thread th JOIN thread_track tt ON tt.utid=th.utid LEFT JOIN slice s ON s.track_id=tt.id WHERE th.name LIKE '%GLThread%' OR th.name LIKE '%RenderThread%' OR th.name LIKE '%Rovio%' GROUP BY th.utid ORDER BY slice_s DESC LIMIT 80""")
          ]
          for title,sql in queries:
              try: section(title,tp.query(sql).as_pandas_dataframe())
              except Exception as e: out.append("\n## "+title+"\nQuery unavailable: "+str(e)+"\n")
          report="# ABT GPU wait deep-dive\n"+"".join(out)
          Path("abt-gpu-wait-deep-dive.md").write_text(report)
          print(report)
          tp.close()
          PY
          python analyze.py

      - name: Upload deep-dive report
        uses: actions/upload-artifact@v4
        with:
          name: abt-gpu-wait-deep-dive
          path: abt-gpu-wait-deep-dive.md
          retention-days: 7
