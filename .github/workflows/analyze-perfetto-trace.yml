name: Analyze Perfetto Trace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/analyze-perfetto-trace.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download trace
        run: |
          curl -fL --retry 3 "https://github.com/perrunofortnite209-max/Angry-Birds-Transformers-Revival-Mod/releases/download/game/abt.pftrace" -o abt.pftrace
          test -s abt.pftrace
          sha256sum abt.pftrace

      - name: Install trace processor client
        run: |
          python -m pip install --upgrade pip
          python -m pip install perfetto pandas

      - name: Analyze trace
        run: |
          cat > analyze.py <<'PY'
          from perfetto.trace_processor import TraceProcessor
          from pathlib import Path
          import pandas as pd

          out = []
          def run(sql):
              return tp.query(sql).as_pandas_dataframe()

          def section(title, df):
              out.append("\\n## " + title + "\\n")
              if df is None or len(df.index) == 0:
                  out.append("(sin datos)\\n")
              else:
                  out.append(df.to_string(index=False) + "\\n")

          tp = TraceProcessor(trace="abt.pftrace")
          try:
              stats = run("SELECT name, value FROM stats ORDER BY name")
              section("Trace stats", stats)
          except Exception as e:
              out.append("\\nStats no disponibles: " + str(e) + "\\n")

          try:
              slices = run("""
                SELECT name, COUNT(*) AS events,
                       ROUND(SUM(dur)/1e9, 3) AS total_seconds,
                       ROUND(MAX(dur)/1e6, 3) AS max_ms
                FROM slice WHERE dur >= 0
                GROUP BY name ORDER BY SUM(dur) DESC LIMIT 60
              """)
              section("Top slices by accumulated duration", slices)
          except Exception as e:
              out.append("\\nSlices no disponibles: " + str(e) + "\\n")

          try:
              sched = run("""
                SELECT th.name AS thread, COUNT(*) AS slices,
                       ROUND(SUM(sc.dur)/1e9, 3) AS running_seconds,
                       ROUND(MAX(sc.dur)/1e6, 3) AS max_run_ms,
                       GROUP_CONCAT(DISTINCT sc.cpu) AS cpus
                FROM sched sc JOIN thread th USING(utid)
                WHERE sc.dur > 0
                GROUP BY th.name ORDER BY SUM(sc.dur) DESC LIMIT 40
              """)
              section("Top scheduled threads", sched)
          except Exception as e:
              out.append("\\nSched no disponible: " + str(e) + "\\n")

          try:
              counters = run("""
                SELECT t.name AS counter, COUNT(*) AS samples,
                       ROUND(MIN(c.value), 2) AS min_value,
                       ROUND(AVG(c.value), 2) AS avg_value,
                       ROUND(MAX(c.value), 2) AS max_value
                FROM counter c JOIN counter_track t ON t.id = c.track_id
                GROUP BY t.name ORDER BY t.name LIMIT 100
              """)
              section("Counter tracks", counters)
          except Exception as e:
              out.append("\\nCounters no disponibles: " + str(e) + "\\n")

          try:
              timing = run("""
                SELECT ROUND((MAX(ts + dur) - MIN(ts))/1e9, 2) AS slice_span_seconds,
                       COUNT(*) AS complete_slices
                FROM slice WHERE dur > 0
              """)
              section("Trace time span", timing)
          except Exception as e:
              out.append("\\nTrace span no disponible: " + str(e) + "\\n")

          try:
              draw = run("""
                SELECT COUNT(*) AS frames,
                       ROUND(AVG(dur)/1e6, 2) AS avg_ms,
                       ROUND(MAX(dur)/1e6, 2) AS max_ms,
                       SUM(CASE WHEN dur > 16666667 THEN 1 ELSE 0 END) AS over_16_7ms,
                       SUM(CASE WHEN dur > 33333333 THEN 1 ELSE 0 END) AS over_33_3ms,
                       SUM(CASE WHEN dur > 50000000 THEN 1 ELSE 0 END) AS over_50ms
                FROM slice WHERE name = 'onDrawFrame' AND dur > 0
              """)
              section("Game draw-frame timing", draw)
          except Exception as e:
              out.append("\\nDraw timing no disponible: " + str(e) + "\\n")

          try:
              glstate = run("""
                SELECT st.state, COUNT(*) AS intervals,
                       ROUND(SUM(st.dur)/1e9, 3) AS total_seconds,
                       ROUND(MAX(st.dur)/1e6, 3) AS max_interval_ms,
                       GROUP_CONCAT(DISTINCT st.blocked_function) AS blocked_functions
                FROM thread_state st JOIN thread th USING(utid)
                WHERE th.name LIKE 'GLThread%'
                GROUP BY st.state ORDER BY SUM(st.dur) DESC
              """)
              section("GLThread scheduler states", glstate)
          except Exception as e:
              out.append("\\nGLThread states no disponibles: " + str(e) + "\\n")

          try:
              missed = run("""
                SELECT t.name AS counter, COUNT(*) AS samples,
                       SUM(CASE WHEN c.value > 0 THEN 1 ELSE 0 END) AS nonzero_samples,
                       ROUND(AVG(c.value), 3) AS average,
                       MAX(c.value) AS maximum
                FROM counter c JOIN counter_track t ON t.id = c.track_id
                WHERE t.name LIKE '%PrevFrameMissed%'
                   OR t.name LIKE '%PrevGpuFrameMissed%'
                   OR t.name LIKE '%PrevHwcFrameMissed%'
                GROUP BY t.name
              """)
              section("Frame-miss counters", missed)
          except Exception as e:
              out.append("\\nFrame miss counters no disponibles: " + str(e) + "\\n")

          try:
              heavy = run("""
                SELECT ROUND(dur/1e6, 2) AS duration_ms, ts, name
                FROM slice WHERE name = 'onDrawFrame' AND dur > 0
                ORDER BY dur DESC LIMIT 20
              """)
              section("20 slowest game draw frames", heavy)
          except Exception as e:
              out.append("\\nSlow frames no disponibles: " + str(e) + "\\n")

          try:
              child_work = run("""
                WITH slow AS (
                  SELECT id, ts, dur
                  FROM slice
                  WHERE name = 'onDrawFrame' AND dur > 16666667
                  ORDER BY dur DESC LIMIT 40
                )
                SELECT ROUND(p.dur/1e6, 2) AS frame_ms,
                       p.ts AS frame_ts,
                       c.name AS child_slice,
                       COUNT(*) AS occurrences,
                       ROUND(SUM(c.dur)/1e6, 2) AS child_total_ms,
                       ROUND(MAX(c.dur)/1e6, 2) AS child_max_ms
                FROM slow p JOIN slice c ON c.parent_id = p.id
                WHERE c.dur >= 0
                GROUP BY p.id, c.name
                ORDER BY p.dur DESC, SUM(c.dur) DESC
              """)
              section("Work nested inside slow draw frames", child_work)
          except Exception as e:
              out.append("\\nNested frame work unavailable: " + str(e) + "\\n")

          try:
              keywords = run("""
                SELECT name, COUNT(*) AS occurrences,
                       ROUND(SUM(dur)/1e9, 3) AS total_seconds,
                       ROUND(MAX(dur)/1e6, 3) AS max_ms
                FROM slice
                WHERE dur >= 0 AND (
                  LOWER(name) LIKE '%explos%' OR
                  LOWER(name) LIKE '%particle%' OR
                  LOWER(name) LIKE '%effect%' OR
                  LOWER(name) LIKE '%damage%' OR
                  LOWER(name) LIKE '%projectile%' OR
                  LOWER(name) LIKE '%physics%'
                )
                GROUP BY name ORDER BY SUM(dur) DESC LIMIT 80
              """)
              section("Explosion, particle, physics and damage slices", keywords)
          except Exception as e:
              out.append("\\nKeyword slices unavailable: " + str(e) + "\\n")

          try:
              frame_context = run("""
                SELECT ROUND(dur/1e6, 2) AS frame_ms, ts, id, track_id
                FROM slice
                WHERE name = 'onDrawFrame' AND dur > 16666667
                ORDER BY dur DESC LIMIT 40
              """)
              section("Slow frame timestamps and tracks", frame_context)
          except Exception as e:
              out.append("\\nFrame context unavailable: " + str(e) + "\\n")

          Path("abt-trace-report.md").write_text("# Angry Birds Transformers - Perfetto analysis\\n\\n" + "".join(out))
          print(Path("abt-trace-report.md").read_text())
          tp.close()
          PY
          python analyze.py

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: abt-perfetto-analysis
          path: abt-trace-report.md
          retention-days: 7
