name: XOX2 codec diagnostics

on:
  push:
    branches: [feature/full-revival-mod]
    paths:
      - ".github/workflows/xox2-codec-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/xox2_codec.py
      - run: python tools/xox2_codec.py --self-test
